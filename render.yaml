services:
  - type: web
    name: art-gallery-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /artworks
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: FRONTEND_URL
        sync: false # set to the deployed Vercel URL once the frontend is live
